<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Чайный Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-color: #0d0d0e;
      --card-bg: #161618;
      --input-bg: #1f1f22;
      --border-color: #2c2c30;
      --text-color: #ededed;
      --hint-color: #8e8e93;
      --accent-color: #3a86ff;
      --accent-hover: #2563eb;
      --danger-color: #ff453a;
      --star-active: #ffd60a;
      --star-inactive: #2c2c30;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px 16px 80px 16px;
      box-sizing: border-box;
    }

    h2 { margin-top: 0; color: var(--text-color); font-size: 20px; font-weight: 700; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: var(--hint-color); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }

    .rating-select {
      display: flex;
      gap: 4px;
      align-items: center;
      user-select: none;
      margin-top: 4px;
    }

    .star-icon {
      font-size: 22px;
      color: var(--star-inactive);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .star-icon.active { color: var(--star-active); }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background-color: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-edit {
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    .category-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-top: 16px;
      margin-bottom: 12px;
    }

    .filter-chip {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--hint-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-chip.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 600;
    }

    .tea-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge {
      background: var(--input-bg);
      color: var(--hint-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--border-color);
    }

    .notes-box {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent-color);
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 13px;
      border-radius: 0 8px 8px 0;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #121214;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      z-index: 9000;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--hint-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      cursor: pointer;
      width: 50%;
    }

    .nav-btn.active {
      color: var(--text-color);
      font-weight: bold;
    }

    .review-item {
      background: var(--input-bg);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid var(--border-color);
    }
    
    .card-photo-thumb {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- ВКЛАДКА: МОЯ КОЛЛЕКЦИЯ -->
  <div id="tabMyCollection">
    <h2>☕ Личная коллекция</h2>

    <div class="form-group">
      <label>Название чая</label>
      <input type="text" id="teaName" placeholder="например: Да Хун Пао">
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <label>Год</label>
        <input type="number" id="teaYear" value="2024">
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Категория</label>
        <select id="teaCategory">
          <option value="Шу Пуэр">Шу Пуэр</option>
          <option value="Шен Пуер">Шен Пуэр</option>
          <option value="Улун">Улун</option>
          <option value="Красный чай">Красный чай</option>
          <option value="Зелёный чай">Зелёный чай</option>
          <option value="Белый чай">Белый чай</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Оценка</label>
      <div class="rating-select" id="ratingSelect"></div>
    </div>

    <div class="form-group">
      <label>Заметки / Впечатления</label>
      <textarea id="teaNotes" rows="3" placeholder="Опиши вкус, аромат, проливы..."></textarea>
    </div>

    <button class="btn" onclick="savePersonalTea()">Добавить в личную коллекцию</button>

    <div class="tea-list" id="teaList" style="margin-top: 20px;"></div>
  </div>

  <!-- ВКЛАДКА: ОБЩИЙ КАТАЛОГ -->
  <div id="tabCatalog" style="display: none;">
    <h2>⭐ Общий Каталог</h2>

    <!-- Форма администратора (скрыта по умолчанию, открывается если ты Админ) -->
    <div id="adminCatalogForm" style="display: none; background: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid var(--accent-color); margin-bottom: 16px;">
      <h3 style="margin-top: 0; font-size: 15px; color: var(--accent-color);">Панель Администратора</h3>
      <div class="form-group">
        <label>Название товара</label>
        <input type="text" id="catTeaName" placeholder="Название чая">
      </div>
      <div class="form-group">
        <label>Ссылка на фото (URL)</label>
        <input type="text" id="catTeaPhoto" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="catTeaCategory">
          <option value="Шу Пуэр">Шу Пуэр</option>
          <option value="Шен Пуер">Шен Пуэр</option>
          <option value="Улун">Улун</option>
          <option value="Красный чай">Красный чай</option>
          <option value="Зелёный чай">Зелёный чай</option>
        </select>
      </div>
      <button class="btn" onclick="addCatalogTeaByAdmin()">Опубликовать для всех</button>
    </div>

    <div class="tea-list" id="catalogList"></div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="btnTabMy" onclick="switchTab('my')">
      <span>🍃 Личный</span>
    </button>
    <button class="nav-btn" id="btnTabCatalog" onclick="switchTab('catalog')">
      <span>⭐ Общий Каталог</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp || {};
    if (tg.ready) tg.ready();

    // 🔴 ВНИМАНИЕ: Замени 0 на свой реальный ID Telegram (число)
    const ADMIN_TELEGRAM_ID = 770549804; 

    let teas = [];
    let catalogTeas = [];
    let currentRating = 8;

    // Проверка прав администратора
    function checkIsAdmin() {
      const urlParams = new URLSearchParams(window.location.search);
      const isParamAdmin = urlParams.get('admin') === 'true';
      const isIdAdmin = tg.initDataUnsafe?.user?.id === ADMIN_TELEGRAM_ID;
      
      return isParamAdmin || isIdAdmin;
    }

    function initApp() {
      if (checkIsAdmin()) {
        const adminForm = document.getElementById('adminCatalogForm');
        if (adminForm) adminForm.style.display = 'block';
      }
      initRatingStars();
      renderPersonalTeas();
      renderCatalog();
    }

    function switchTab(tab) {
      document.getElementById('tabMyCollection').style.display = tab === 'my' ? 'block' : 'none';
      document.getElementById('tabCatalog').style.display = tab === 'catalog' ? 'block' : 'none';
      document.getElementById('btnTabMy').classList.toggle('active', tab === 'my');
      document.getElementById('btnTabCatalog').classList.toggle('active', tab === 'catalog');
    }

    function initRatingStars() {
      const container = document.getElementById('ratingSelect');
      container.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        container.innerHTML += `<span class="star-icon ${i <= currentRating ? 'active' : ''}" onclick="setRating(${i})">★</span>`;
      }
    }

    function setRating(val) {
      currentRating = val;
      initRatingStars();
    }

    function savePersonalTea() {
      const name = document.getElementById('teaName').value.trim();
      if (!name) return alert('Введите название!');

      const newTea = {
        id: Date.now(),
        name,
        year: document.getElementById('teaYear').value,
        category: document.getElementById('teaCategory').value,
        rating: currentRating,
        notes: document.getElementById('teaNotes').value.trim()
      };

      teas.unshift(newTea);
      localStorage.setItem('my_private_teas', JSON.stringify(teas));
      document.getElementById('teaName').value = '';
      document.getElementById('teaNotes').value = '';
      renderPersonalTeas();
    }

    function renderPersonalTeas() {
      const list = document.getElementById('teaList');
      list.innerHTML = teas.map(tea => `
        <div class="tea-card">
          <div class="card-header">
            <b>${tea.name} (${tea.year})</b>
            <span class="badge">${tea.category}</span>
          </div>
          <div style="font-size: 13px; color: var(--star-active);">★ ${tea.rating}/10</div>
          <div class="notes-box">${tea.notes || 'Без описания'}</div>
        </div>
      `).join('');
    }

    // Публикация товара админом
    function addCatalogTeaByAdmin() {
      const name = document.getElementById('catTeaName').value.trim();
      const photo = document.getElementById('catTeaPhoto').value.trim();
      if (!name) return alert('Введите название!');

      const newItem = {
        id: Date.now(),
        name,
        photo,
        category: document.getElementById('catTeaCategory').value,
        reviews: []
      };

      // Отправляем данные боту Telegram для общего доступа
      if (tg.sendData) {
        tg.sendData(JSON.stringify({ action: "ADD_PRODUCT", item: newItem }));
      } else {
        alert('Данные отправлены боту.');
      }
    }

    // Добавление отзыва пользователем
    function addReview(teaId) {
      const input = document.getElementById(`rev_${teaId}`);
      const text = input.value.trim();
      if (!text) return;

      const userName = tg.initDataUnsafe?.user?.first_name || 'Пользователь';
      const reviewPayload = {
        action: "ADD_REVIEW",
        teaId: teaId,
        review: { user: userName, text: text }
      };

      // Передаём отзыв боту, чтобы он расслал/сохранил его для остальных
      if (tg.sendData) {
        tg.sendData(JSON.stringify(reviewPayload));
        input.value = '';
        alert('Отзыв отправлен!');
      } else {
        alert(' Ошибка отправки Telegram.');
      }
    }

    function renderCatalog() {
      const list = document.getElementById('catalogList');
      if (catalogTeas.length === 0) {
        list.innerHTML = '<div style="color: var(--hint-color); font-size: 13px; text-align: center; margin-top: 20px;">Каталог пуст</div>';
        return;
      }

      list.innerHTML = catalogTeas.map(tea => `
        <div class="tea-card">
          ${tea.photo ? `<img src="${tea.photo}" class="card-photo-thumb" />` : ''}
          <div class="card-header">
            <b>${tea.name}</b>
            <span class="badge">${tea.category}</span>
          </div>
          <div style="margin-top: 10px;">
            <b style="font-size: 12px; color: var(--hint-color);">Отзывы:</b>
            ${(tea.reviews || []).map(r => `
              <div class="review-item">
                <b style="font-size: 12px;">${r.user}:</b>
                <span style="font-size: 13px;">${r.text}</span>
              </div>
            `).join('') || '<div style="font-size: 11px; color: var(--hint-color); margin-top: 4px;">Пока нет отзывов</div>'}
          </div>
          <div style="margin-top: 10px; display: flex; gap: 6px;">
            <input type="text" id="rev_${tea.id}" placeholder="Оставить отзыв..." style="padding: 8px; font-size: 13px;">
            <button class="btn btn-edit" onclick="addReview(${tea.id})" style="width: auto;">Отправить</button>
          </div>
        </div>
      `).join('');
    }

    // Загрузка локальных личных данных
    try {
      teas = JSON.parse(localStorage.getItem('my_private_teas')) || [];
    } catch(e) {}

    initApp();
  </script>
</body>
</html>
