<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чайний Склад</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Бібліотека для генерації PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    :root {
      --bg-color: #18181a;
      --card-bg: #242428;
      --input-bg: #1e1e22;
      --border-color: #38383e;
      --text-color: #f3ece2;
      --hint-color: #9e9ea8;
      --accent-color: #e5a968;
      --danger-color: #e55b5b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 { 
      margin-top: 0; 
      color: var(--accent-color);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 11px;
      color: var(--hint-color);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }

    input[type="file"] { padding: 8px; font-size: 12px; }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background-color: var(--accent-color);
      color: #18181a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s;
    }

    .btn:active { opacity: 0.8; }

    .btn-secondary {
      background: #322b24;
      color: var(--accent-color);
      border: 1px solid #4a3e32;
    }

    .btn-danger {
      background: rgba(229, 91, 91, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(229, 91, 91, 0.3);
      padding: 8px 12px;
      font-size: 12px;
      width: auto;
      margin-top: 0;
      cursor: pointer;
      border-radius: 8px;
    }

    .btn-share {
      background: rgba(229, 169, 104, 0.15);
      color: var(--accent-color);
      border: 1px solid rgba(229, 169, 104, 0.3);
      padding: 8px 12px;
      font-size: 12px;
      width: auto;
      margin-top: 0;
      cursor: pointer;
      border-radius: 8px;
    }

    .tea-list { margin-top: 24px; }

    .tea-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tea-title { font-size: 16px; font-weight: 700; }

    .badge {
      background: #3d2b1f;
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #543c2c;
    }

    .card-body { display: flex; gap: 12px; }

    .tea-img {
      width: 75px;
      height: 75px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .tea-info { flex-grow: 1; }

    .notes-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--accent-color);
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 13px;
      border-radius: 0 8px 8px 0;
      color: #d1c9bf;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    #pdf-template {
      display: none;
      background: #faf7f2;
      color: #2c2623;
      padding: 24px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <h2>🍵 Чайний Склад</h2>

  <!-- Форма додавання -->
  <div class="form-group">
    <label>Назва чаю</label>
    <input type="text" id="teaName" placeholder="наприклад: Менхай 7562">
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>Рік</label>
      <input type="number" id="teaYear" value="2023">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Категорія</label>
      <select id="teaCategory">
        <option value="Шу Пуер">Шу Пуер</option>
        <option value="Шен Пуер">Шен Пуер</option>
        <option value="Улун">Улун</option>
        <option value="Червоний чай">Червоний чай</option>
        <option value="Зелений чай">Зелений чай</option>
        <option value="Білий чай">Білий чай</option>
        <option value="Жовтий чай">Жовтий чай</option>
        <option value="Хей Ча (Чорний)">Хей Ча (Чорний)</option>
        <option value="Я Бао (Бруньки)">Я Бао (Бруньки)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Фото бліна / листя</label>
    <input type="file" id="teaPhoto" accept="image/*">
  </div>

  <div class="form-group">
    <label>Враження після чаювання</label>
    <textarea id="teaNotes" rows="3" placeholder="Опиши смак, аромат, стан, посуд..."></textarea>
  </div>

  <button class="btn" onclick="addTea()">Додати до колекції</button>
  <button class="btn btn-secondary" onclick="downloadPDF()">📄 Завантажити PDF-каталог</button>

  <!-- Список чаю -->
  <div class="tea-list" id="teaList"></div>

  <!-- Прихований контейнер для PDF -->
  <div id="pdf-template">
    <h1 style="color: #2a1e15; margin-bottom: 5px;">Моя Чайна Колекція</h1>
    <p style="color: #8c7b6c; font-size: 12px; margin-top: 0;">Особиста бібліотека чаювань</p>
    <hr style="border: 0; border-top: 1px solid #d5c8b8; margin-bottom: 20px;">
    <div id="pdfContent"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let teas = [];
    let currentPhotoBase64 = "";

    // 1. Завантаження даних з Telegram CloudStorage або LocalStorage
    function loadTeas() {
      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('my_teas_cloud', (err, value) => {
          let cloudTeas = [];
          if (!err && value) {
            try { cloudTeas = JSON.parse(value); } catch(e) {}
          }
          
          let localTeas = JSON.parse(localStorage.getItem('my_teas_ukr')) || [];
          
          // Об'єднуємо дані: якщо позиції є у хмарі, але немає фото, підтягуємо локальні фото
          if (cloudTeas.length > 0) {
            teas = cloudTeas.map(cTea => {
              const match = localTeas.find(lTea => lTea.name === cTea.name && lTea.year === cTea.year);
              return { ...cTea, photo: match ? match.photo : "" };
            });
          } else {
            teas = localTeas;
          }
          renderTeas();
        });
      } else {
        teas = JSON.parse(localStorage.getItem('my_teas_ukr')) || [];
        renderTeas();
      }
    }

    // 2. Збереження (текст у хмару, важкі фото — в пам'ять пристрою)
    function saveTeas() {
      localStorage.setItem('my_teas_ukr', JSON.stringify(teas));

      if (tg.CloudStorage) {
        const lightTeas = teas.map(t => ({
          name: t.name,
          year: t.year,
          category: t.category,
          notes: t.notes
        }));
        
        tg.CloudStorage.setItem('my_teas_cloud', JSON.stringify(lightTeas), (err) => {
          if (err) console.error("CloudStorage save error:", err);
        });
      }
    }

    // Обробка фото із автоматичним стисненням
    document.getElementById('teaPhoto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 350;
            const scaleFactor = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleFactor;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);
          }
        };
        reader.readAsDataURL(file);
      }
    });

    function renderTeas() {
      const list = document.getElementById('teaList');
      const pdfContent = document.getElementById('pdfContent');
      list.innerHTML = '';
      pdfContent.innerHTML = '';

      if (teas.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: var(--hint-color); font-size: 13px; margin-top: 30px;">Колекція порожня. Додай свій перший чай вище!</p>';
        return;
      }

      teas.forEach((tea, index) => {
        const photoHtml = tea.photo ? `<img src="${tea.photo}" class="tea-img">` : '';

        list.innerHTML += `
          <div class="tea-card">
            <div class="card-header">
              <span class="tea-title">${tea.name} (${tea.year})</span>
              <span class="badge">${tea.category}</span>
            </div>
            <div class="card-body">
              ${photoHtml}
              <div class="tea-info">
                <div class="notes-box">${tea.notes || 'Без опису'}</div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn-share" onclick="shareTea(${index})">✈️ Поділитися</button>
              <button class="btn btn-danger" onclick="deleteTea(${index})">🗑 Видалити</button>
            </div>
          </div>
        `;

        const pdfPhotoHtml = tea.photo ? `<img src="${tea.photo}" style="width: 70px; height: 70px; object-fit: cover; border-radius: 6px; float: left; margin-right: 12px;">` : '';
        pdfContent.innerHTML += `
          <div style="background: #fff; padding: 14px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #e8e2d8; page-break-inside: avoid; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <strong style="font-size: 15px; color: #1a1615;">${tea.name} (${tea.year} р.)</strong>
              <span style="background: #f4ebe1; color: #6b3e26; padding: 3px 8px; font-size: 11px; border-radius: 4px; font-weight: bold;">${tea.category}</span>
            </div>
            ${pdfPhotoHtml}
            <p style="background: #faf6f0; padding: 8px 10px; border-left: 3px solid #c59b6c; font-size: 12px; margin: 0; color: #38302a; min-height: 40px;">
              ${tea.notes || 'Без опису'}
            </p>
          </div>
        `;
      });
    }

    function addTea() {
      const name = document.getElementById('teaName').value.trim();
      const year = document.getElementById('teaYear').value;
      const category = document.getElementById('teaCategory').value;
      const notes = document.getElementById('teaNotes').value.trim();

      if (!name) return alert('Будь ласка, введи назву чаю!');

      teas.unshift({
        name,
        year,
        category,
        notes,
        photo: currentPhotoBase64
      });

      saveTeas();
      
      document.getElementById('teaName').value = '';
      document.getElementById('teaNotes').value = '';
      document.getElementById('teaPhoto').value = '';
      currentPhotoBase64 = "";
      
      renderTeas();
    }

    function deleteTea(index) {
      if (confirm('Видалити цей чай з колекції?')) {
        teas.splice(index, 1);
        saveTeas();
        renderTeas();
      }
    }

    function shareTea(index) {
      const tea = teas[index];
      
      const cardText = `🍃 *${tea.name.toUpperCase()}* (${tea.year} р.)\n` +
                       `━━━━━━━━━━━━━━━━━━\n` +
                       `🏷 *Категорія:* #${tea.category.replace(/\s+/g, '_')}\n` +
                       `📝 *Враження та дегустація:*\n${tea.notes || 'Чудовий чай, рекомендую!'}\n` +
                       `━━━━━━━━━━━━━━━━━━\n` +
                       `📌 _Збережено в Чайному Складі_`;

      const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(cardText)}`;
      tg.openTelegramLink(shareUrl);
    }

    function downloadPDF() {
      if (teas.length === 0) return alert('Колекція порожня!');

      const element = document.getElementById('pdf-template');
      element.style.display = 'block';

      const opt = {
        margin:       10,
        filename:     'Moya_Chaina_Kolektsiya.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.style.display = 'none';
      });
    }

    loadTeas();
  </script>
</body>
</html>
