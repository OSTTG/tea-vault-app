<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чайний Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-color: #18181a;
      --card-bg: #242428;
      --input-bg: #1e1e22;
      --border-color: #38383e;
      --text-color: #f3ece2;
      --hint-color: #9e9ea8;
      --accent-color: #e5a968;
      --danger-color: #e55b5b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 { margin-top: 0; color: var(--accent-color); font-size: 20px; font-weight: 700; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: var(--hint-color); margin-bottom: 5px; text-transform: uppercase; }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
    input[type="file"] { padding: 8px; font-size: 12px; }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background-color: var(--accent-color);
      color: #18181a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:active { opacity: 0.8; }

    .btn-cancel {
      background: transparent;
      color: var(--hint-color);
      border: 1px solid var(--border-color);
    }

    .btn-edit {
      background: rgba(229, 169, 104, 0.1);
      color: var(--accent-color);
      border: 1px solid rgba(229, 169, 104, 0.25);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    .btn-danger {
      background: rgba(229, 91, 91, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(229, 91, 91, 0.3);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    .tea-list { margin-top: 24px; }

    .tea-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tea-title { font-size: 16px; font-weight: 700; }

    .badge {
      background: #3d2b1f;
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #543c2c;
    }

    .card-body { display: flex; gap: 12px; }

    .tea-img {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .notes-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--accent-color);
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 13px;
      border-radius: 0 8px 8px 0;
      color: #d1c9bf;
      white-space: pre-wrap;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <h2>🍵 Чайний Склад</h2>

  <div class="form-group">
    <label>Назва чаю</label>
    <input type="text" id="teaName" placeholder="наприклад: Менхай 7562">
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>Рік</label>
      <input type="number" id="teaYear" value="2023">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Категорія</label>
      <select id="teaCategory">
        <option value="Шу Пуер">Шу Пуер</option>
        <option value="Шен Пуер">Шен Пуер</option>
        <option value="Улун">Улун</option>
        <option value="Червоний чай">Червоний чай</option>
        <option value="Зелений чай">Зелений чай</option>
        <option value="Білий чай">Білий чай</option>
        <option value="Жовтий чай">Жовтий чай</option>
        <option value="Хей Ча (Чорний)">Хей Ча (Чорний)</option>
        <option value="Я Бао (Бруньки)">Я Бао (Бруньки)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Фото бліна / листя</label>
    <input type="file" id="teaPhoto" accept="image/*">
  </div>

  <div class="form-group">
    <label>Враження після чаювання</label>
    <textarea id="teaNotes" rows="3" placeholder="Опиши смак, аромат, стан, посуд..."></textarea>
  </div>

  <button class="btn" id="saveBtn" onclick="saveTeaHandler()">Додати до колекції</button>
  <button class="btn btn-cancel" id="cancelBtn" onclick="resetForm()" style="display: none; margin-top: 6px;">Скасувати редагування</button>

  <div class="tea-list" id="teaList"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let teas = [];
    let currentPhotoBase64 = "";
    let editingId = null;

    function loadTeas() {
      const localData = localStorage.getItem('my_teas_v4');
      if (localData) {
        try { teas = JSON.parse(localData); } catch(e) {}
      }

      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('my_teas_cloud_v4', (err, value) => {
          if (!err && value) {
            try {
              const cloudTeas = JSON.parse(value);
              if (cloudTeas && cloudTeas.length > 0) {
                teas = cloudTeas.map(cTea => {
                  const match = teas.find(lTea => lTea.id === cTea.id);
                  return { ...cTea, photo: match ? match.photo : "" };
                });
                localStorage.setItem('my_teas_v4', JSON.stringify(teas));
              }
            } catch(e) {}
          }
          renderTeas();
        });
      } else {
        renderTeas();
      }
    }

    function saveTeasToStorage() {
      localStorage.setItem('my_teas_v4', JSON.stringify(teas));

      if (tg.CloudStorage) {
        const cleanTeas = teas.map(t => ({
          id: t.id,
          name: t.name,
          year: t.year,
          category: t.category,
          notes: t.notes
        }));

        tg.CloudStorage.setItem('my_teas_cloud_v4', JSON.stringify(cleanTeas), (err) => {
          if (err) console.error("Cloud Storage Error:", err);
        });
      }
    }

    document.getElementById('teaPhoto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 250;
            const scaleFactor = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleFactor;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
          }
        };
        reader.readAsDataURL(file);
      }
    });

    function renderTeas() {
      const list = document.getElementById('teaList');
      list.innerHTML = '';

      if (teas.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: var(--hint-color); font-size: 13px; margin-top: 30px;">Колекція порожня. Додай свій перший чай!</p>';
        return;
      }

      teas.forEach((tea) => {
        const photoHtml = tea.photo ? `<img src="${tea.photo}" class="tea-img">` : '';

        list.innerHTML += `
          <div class="tea-card">
            <div class="card-header">
              <span class="tea-title">${tea.name} (${tea.year})</span>
              <span class="badge">${tea.category}</span>
            </div>
            <div class="card-body">
              ${photoHtml}
              <div style="flex-grow: 1;">
                <div class="notes-box">${tea.notes || 'Без опису'}</div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn-share" onclick="shareTea(${tea.id})">✈️ Поділитися</button>
              <button class="btn btn-edit" onclick="editTea(${tea.id})">✏️ Редагувати</button>
              <button class="btn btn-danger" onclick="deleteTea(${tea.id})">🗑 Видалити</button>
            </div>
          </div>
        `;
      });
    }

    function saveTeaHandler() {
      const name = document.getElementById('teaName').value.trim();
      const year = document.getElementById('teaYear').value;
      const category = document.getElementById('teaCategory').value;
      const notes = document.getElementById('teaNotes').value.trim();

      if (!name) return alert('Будь ласка, введи назву чаю!');

      if (editingId) {
        const index = teas.findIndex(t => t.id === editingId);
        if (index !== -1) {
          teas[index].name = name;
          teas[index].year = year;
          teas[index].category = category;
          teas[index].notes = notes;
          if (currentPhotoBase64) {
            teas[index].photo = currentPhotoBase64;
          }
        }
      } else {
        teas.unshift({
          id: Date.now(),
          name,
          year,
          category,
          notes,
          photo: currentPhotoBase64
        });
      }

      saveTeasToStorage();
      resetForm();
      renderTeas();
    }

    function editTea(id) {
      const tea = teas.find(t => t.id === id);
      if (!tea) return;

      editingId = tea.id;
      document.getElementById('teaName').value = tea.name;
      document.getElementById('teaYear').value = tea.year;
      document.getElementById('teaCategory').value = tea.category;
      document.getElementById('teaNotes').value = tea.notes;

      document.getElementById('saveBtn').innerText = 'Зберегти зміни';
      document.getElementById('cancelBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      editingId = null;
      document.getElementById('teaName').value = '';
      document.getElementById('teaNotes').value = '';
      document.getElementById('teaPhoto').value = '';
      currentPhotoBase64 = "";

      document.getElementById('saveBtn').innerText = 'Додати до колекції';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    function deleteTea(id) {
      if (confirm('Видалити цей чай з колекції?')) {
        teas = teas.filter(t => t.id !== id);
        saveTeasToStorage();
        if (editingId === id) resetForm();
        renderTeas();
      }
    }

    // КРАСИВЫЙ И ЧИСТЫЙ ФОРМАТ ДЛЯ ОТПРАВКИ СО СМАЙЛИКАМИ
    function shareTea(id) {
      const tea = teas.find(t => t.id === id);
      if (!tea) return;

      const categoryTag = tea.category.replace(/\s+/g, '_');
      
      let cardText = `🍃 ${tea.name.toUpperCase()} (${tea.year} р.)\n`;
      cardText += `━━━━━━━━━━━━━━━━━━\n`;
      cardText += `🏷 Категорія: #${categoryTag}\n`;
      if (tea.notes) {
        cardText += `📝 Враження:\n${tea.notes}\n`;
      }
      cardText += `━━━━━━━━━━━━━━━━━━\n`;
      cardText += `📌 Чайний Склад`;

      const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(cardText)}`;
      tg.openTelegramLink(shareUrl);
    }

    loadTeas();
  </script>
</body>
</html>
