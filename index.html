<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чайний Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-color: #18181a;
      --card-bg: #242428;
      --input-bg: #1e1e22;
      --border-color: #38383e;
      --text-color: #f3ece2;
      --hint-color: #9e9ea8;
      --accent-color: #e5a968;
      --danger-color: #e55b5b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 { margin-top: 0; color: var(--accent-color); font-size: 20px; font-weight: 700; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: var(--hint-color); margin-bottom: 5px; text-transform: uppercase; }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
    input[type="file"] { padding: 8px; font-size: 12px; }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background-color: var(--accent-color);
      color: #18181a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:active { opacity: 0.8; }

    .btn-cancel {
      background: transparent;
      color: var(--hint-color);
      border: 1px solid var(--border-color);
    }

    .btn-edit {
      background: rgba(229, 169, 104, 0.1);
      color: var(--accent-color);
      border: 1px solid rgba(229, 169, 104, 0.25);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    .btn-danger {
      background: rgba(229, 91, 91, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(229, 91, 91, 0.3);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    /* СТИЛИ ПРЕВЬЮ ПРИ ВЫБОРЕ И ГАЛЕРЕИ В КАРТОЧКЕ */
    .photo-preview-grid, .card-photo-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .preview-thumb, .card-photo-thumb {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    /* ФИЛЬТРЫ КАТЕГОРИЙ */
    .category-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-top: 20px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .category-filters::-webkit-scrollbar { display: none; }

    .filter-chip {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--hint-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background-color: var(--accent-color);
      color: #18181a;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .tea-list { margin-top: 8px; }

    .tea-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tea-title { font-size: 16px; font-weight: 700; }

    .badge {
      background: #3d2b1f;
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #543c2c;
    }

    .notes-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--accent-color);
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 13px;
      border-radius: 0 8px 8px 0;
      color: #d1c9bf;
      white-space: pre-wrap;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <h2>🍵 Чайний Склад</h2>

  <div class="form-group">
    <label>Назва чаю</label>
    <input type="text" id="teaName" placeholder="наприклад: Менхай 7562">
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>Рік</label>
      <input type="number" id="teaYear" value="2023">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Категорія</label>
      <select id="teaCategory">
        <option value="Шу Пуер">Шу Пуер</option>
        <option value="Шен Пуер">Шен Пуер</option>
        <option value="Улун">Улун</option>
        <option value="Червоний чай">Червоний чай</option>
        <option value="Зелений чай">Зелений чай</option>
        <option value="Білий чай">Білий чай</option>
        <option value="Жовтий чай">Жовтий чай</option>
        <option value="Хей Ча (Чорний)">Хей Ча (Чорний)</option>
        <option value="Я Бао (Бруньки)">Я Бао (Бруньки)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Фотографії (до 6 шт)</label>
    <input type="file" id="teaPhotos" accept="image/*" multiple>
    <div class="photo-preview-grid" id="previewGrid"></div>
  </div>

  <div class="form-group">
    <label>Враження після чаювання</label>
    <textarea id="teaNotes" rows="3" placeholder="Опиши смак, аромат, стан, посуд..."></textarea>
  </div>

  <button class="btn" id="saveBtn" onclick="saveTeaHandler()">Додати до колекції</button>
  <button class="btn btn-cancel" id="cancelBtn" onclick="resetForm()" style="display: none; margin-top: 6px;">Скасувати редагування</button>

  <!-- ФИЛЬТРЫ ПО КАТЕГОРИЯМ -->
  <div class="category-filters" id="categoryFilters"></div>

  <div class="tea-list" id="teaList"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const categoriesList = [
      "Шу Пуер", "Шен Пуер", "Улун", 
      "Червоний чай", "Зелений чай", "Білий чай", 
      "Жовтий чай", "Хей Ча (Чорний)", "Я Бао (Бруньки)"
    ];

    let teas = [];
    let currentPhotosBase64 = [];
    let editingId = null;
    let selectedCategory = "Все";

    function loadTeas() {
      const localData = localStorage.getItem('my_teas_v5');
      if (localData) {
        try { teas = JSON.parse(localData); } catch(e) {}
      }

      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('my_teas_cloud_v5', (err, value) => {
          if (!err && value) {
            try {
              const cloudTeas = JSON.parse(value);
              if (cloudTeas && cloudTeas.length > 0) {
                teas = cloudTeas.map(cTea => {
                  const match = teas.find(lTea => lTea.id === cTea.id);
                  return { 
                    ...cTea, 
                    photos: (match && match.photos) ? match.photos : (match && match.photo ? [match.photo] : []) 
                  };
                });
                localStorage.setItem('my_teas_v5', JSON.stringify(teas));
              }
            } catch(e) {}
          }
          renderTeas();
        });
      } else {
        renderTeas();
      }
    }

    function saveTeasToStorage() {
      localStorage.setItem('my_teas_v5', JSON.stringify(teas));

      if (tg.CloudStorage) {
        const cleanTeas = teas.map(t => ({
          id: t.id,
          name: t.name,
          year: t.year,
          category: t.category,
          notes: t.notes
        }));

        tg.CloudStorage.setItem('my_teas_cloud_v5', JSON.stringify(cleanTeas), (err) => {
          if (err) console.error("Cloud Storage Error:", err);
        });
      }
    }

    // Обработка нескольких выбранных фотографий (до 6 штук)
    document.getElementById('teaPhotos').addEventListener('change', function(e) {
      const files = Array.from(e.target.files).slice(0, 6);
      currentPhotosBase64 = [];
      const previewGrid = document.getElementById('previewGrid');
      previewGrid.innerHTML = '';

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 300;
            const scaleFactor = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleFactor;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const base64 = canvas.toDataURL('image/jpeg', 0.6);
            currentPhotosBase64.push(base64);

            previewGrid.innerHTML += `<img src="${base64}" class="preview-thumb">`;
          }
        };
        reader.readAsDataURL(file);
      });
    });

    function renderFilters() {
      const filtersContainer = document.getElementById('categoryFilters');
      filtersContainer.innerHTML = '';

      const allCount = teas.length;
      const allActive = selectedCategory === "Все" ? "active" : "";
      filtersContainer.innerHTML += `
        <div class="filter-chip ${allActive}" onclick="setFilter('Все')">Все (${allCount})</div>
      `;

      categoriesList.forEach(cat => {
        const count = teas.filter(t => t.category === cat).length;
        if (count > 0 || selectedCategory === cat) {
          const activeClass = selectedCategory === cat ? "active" : "";
          filtersContainer.innerHTML += `
            <div class="filter-chip ${activeClass}" onclick="setFilter('${cat}')">${cat} (${count})</div>
          `;
        }
      });
    }

    function setFilter(cat) {
      selectedCategory = cat;
      renderTeas();
    }

    function renderTeas() {
      renderFilters();

      const list = document.getElementById('teaList');
      list.innerHTML = '';

      const filteredTeas = selectedCategory === "Все" 
        ? teas 
        : teas.filter(t => t.category === selectedCategory);

      if (filteredTeas.length === 0) {
        const emptyMsg = selectedCategory === "Все"
          ? 'Колекція порожня. Додай свій перший чай!'
          : `У категорії "${selectedCategory}" поки немає чаїв.`;
        list.innerHTML = `<p style="text-align: center; color: var(--hint-color); font-size: 13px; margin-top: 30px;">${emptyMsg}</p>`;
        return;
      }

      filteredTeas.forEach((tea) => {
        const photoList = tea.photos || (tea.photo ? [tea.photo] : []);
        let galleryHtml = '';
        if (photoList.length > 0) {
          galleryHtml = `<div class="card-photo-grid">` + 
            photoList.map(p => `<img src="${p}" class="card-photo-thumb">`).join('') + 
            `</div>`;
        }

        list.innerHTML += `
          <div class="tea-card">
            <div class="card-header">
              <span class="tea-title">${tea.name} (${tea.year})</span>
              <span class="badge">${tea.category}</span>
            </div>
            ${galleryHtml}
            <div class="notes-box">${tea.notes || 'Без опису'}</div>
            <div class="card-actions">
              <button class="btn btn-share" onclick="shareTea(${tea.id})">✈️ Поділитися</button>
              <button class="btn btn-edit" onclick="editTea(${tea.id})">✏️ Редагувати</button>
              <button class="btn btn-danger" onclick="deleteTea(${tea.id})">🗑 Видалити</button>
            </div>
          </div>
        `;
      });
    }

    function saveTeaHandler() {
      const name = document.getElementById('teaName').value.trim();
      const year = document.getElementById('teaYear').value;
      const category = document.getElementById('teaCategory').value;
      const notes = document.getElementById('teaNotes').value.trim();

      if (!name) return alert('Будь ласка, введи назву чаю!');

      if (editingId) {
        const index = teas.findIndex(t => t.id === editingId);
        if (index !== -1) {
          teas[index].name = name;
          teas[index].year = year;
          teas[index].category = category;
          teas[index].notes = notes;
          if (currentPhotosBase64.length > 0) {
            teas[index].photos = currentPhotosBase64;
          }
        }
      } else {
        teas.unshift({
          id: Date.now(),
          name,
          year,
          category,
          notes,
          photos: currentPhotosBase64
        });
      }

      saveTeasToStorage();
      resetForm();
      renderTeas();
    }

    function editTea(id) {
      const tea = teas.find(t => t.id === id);
      if (!tea) return;

      editingId = tea.id;
      document.getElementById('teaName').value = tea.name;
      document.getElementById('teaYear').value = tea.year;
      document.getElementById('teaCategory').value = tea.category;
      document.getElementById('teaNotes').value = tea.notes;

      currentPhotosBase64 = tea.photos || (tea.photo ? [tea.photo] : []);
      const previewGrid = document.getElementById('previewGrid');
      previewGrid.innerHTML = currentPhotosBase64.map(p => `<img src="${p}" class="preview-thumb">`).join('');

      document.getElementById('saveBtn').innerText = 'Зберегти зміни';
      document.getElementById('cancelBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      editingId = null;
      document.getElementById('teaName').value = '';
      document.getElementById('teaNotes').value = '';
      document.getElementById('teaPhotos').value = '';
      document.getElementById('previewGrid').innerHTML = '';
      currentPhotosBase64 = [];

      document.getElementById('saveBtn').innerText = 'Додати до колекції';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    function deleteTea(id) {
      if (confirm('Видалити цей чай з колекції?')) {
        teas = teas.filter(t => t.id !== id);
        saveTeasToStorage();
        if (editingId === id) resetForm();
        renderTeas();
      }
    }

    function shareTea(id) {
      const tea = teas.find(t => t.id === id);
      if (!tea) return;

      const categoryTag = tea.category.replace(/\s+/g, '_');
      
      let cardText = `🍃 ${tea.name.toUpperCase()} (${tea.year} р.)\n`;
      cardText += `━━━━━━━━━━━━━━━━━━\n`;
      cardText += `🏷 Категорія: #${categoryTag}\n`;
      if (tea.notes) {
        cardText += `📝 Враження:\n${tea.notes}\n`;
      }
      cardText += `━━━━━━━━━━━━━━━━━━\n`;
      cardText += `📌 Чайний Склад`;

      const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(cardText)}`;
      tg.openTelegramLink(shareUrl);
    }

    loadTeas();
  </script>
</body>
</html>
