<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tea Vault Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Библиотека для генерации PDF из HTML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #1c1a17);
      --card-bg: var(--tg-theme-secondary-bg-color, #282420);
      --text-color: var(--tg-theme-text-color, #f3ece2);
      --hint-color: var(--tg-theme-hint-color, #a89a8b);
      --button-color: var(--tg-theme-button-color, #e5a968);
      --button-text: var(--tg-theme-button-text-color, #1c1a17);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 { margin-top: 0; color: var(--button-color); }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--hint-color);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3a342e;
      background-color: var(--card-bg);
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: var(--button-color);
      color: var(--button-text);
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    .tea-list { margin-top: 24px; }

    .tea-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #3a342e;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: #3d2b1f;
      color: #e5a968;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    .notes-box {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--button-color);
      padding: 8px;
      margin-top: 8px;
      font-size: 13px;
      border-radius: 0 6px 6px 0;
    }

    /* Скрытый HTML-шаблон специально для чистого PDF */
    #pdf-template {
      display: none;
      background: #faf7f2;
      color: #2c2623;
      padding: 20px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <h2>🍵 Моя Чайная Коллекция</h2>

  <!-- Форма добавления -->
  <div class="form-group">
    <label>Название чая</label>
    <input type="text" id="teaName" placeholder="например: Мэнхай 7562">
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>Год</label>
      <input type="number" id="teaYear" value="2023">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Категория</label>
      <select id="teaCategory">
        <option value="Шу Пуэр">Шу Пуэр</option>
        <option value="Шэн Пуэр">Шэн Пуэр</option>
        <option value="Улун">Улун</option>
        <option value="Красный чай">Красный чай</option>
        <option value="Зелёный чай">Зелёный чай</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Заметки после чаепития</label>
    <textarea id="teaNotes" rows="3" placeholder="Опиши вкус, аромат, состояние..."></textarea>
  </div>

  <button onclick="addTea()">Добавить в коллекцию</button>
  <button onclick="downloadPDF()" style="background: #3d2b1f; color: #e5a968; margin-top: 8px;">
    📄 Скачать PDF-каталог
  </button>

  <!-- Список добавленного чая -->
  <div class="tea-list" id="teaList"></div>

  <!-- Шаблон для PDF -->
  <div id="pdf-template">
    <h1 style="color: #2a1e15;">Чайная Коллекция</h1>
    <hr>
    <div id="pdfContent"></div>
  </div>

  <script>
    // Инициализация Telegram WebApp SDK
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на полный экран

    let teas = JSON.parse(localStorage.getItem('my_teas')) || [];

    function renderTeas() {
      const list = document.getElementById('teaList');
      const pdfContent = document.getElementById('pdfContent');
      list.innerHTML = '';
      pdfContent.innerHTML = '';

      teas.forEach((tea, index) => {
        // Рендер в приложение
        list.innerHTML += `
          <div class="tea-card">
            <div class="card-header">
              <strong>${tea.name} (${tea.year})</strong>
              <span class="badge">${tea.category}</span>
            </div>
            <div class="notes-box">${tea.notes}</div>
          </div>
        `;

        // Рендер в верстку для PDF
        pdfContent.innerHTML += `
          <div style="background: #fff; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd;">
            <h3 style="margin: 0; color: #1a1615;">${tea.name} <small style="color: #666;">(${tea.year} г.)</small></h3>
            <span style="background: #f4ebe1; color: #6b3e26; padding: 2px 6px; font-size: 10px; border-radius: 4px;">${tea.category}</span>
            <p style="background: #faf6f0; padding: 8px; border-left: 3px solid #c59b6c; font-size: 12px; margin-top: 8px;">
              ${tea.notes}
            </p>
          </div>
        `;
      });
    }

    function addTea() {
      const name = document.getElementById('teaName').value;
      const year = document.getElementById('teaYear').value;
      const category = document.getElementById('teaCategory').value;
      const notes = document.getElementById('teaNotes').value;

      if (!name) return alert('Введите название!');

      teas.unshift({ name, year, category, notes });
      localStorage.setItem('my_teas', JSON.stringify(teas));
      
      document.getElementById('teaName').value = '';
      document.getElementById('teaNotes').value = '';
      
      renderTeas();
    }

    function downloadPDF() {
      if (teas.length === 0) return alert('Коллекция пуста!');

      const element = document.getElementById('pdf-template');
      element.style.display = 'block';

      const opt = {
        margin:       10,
        filename:     'Tea_Collection.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.style.display = 'none';
      });
    }

    renderTeas();
  </script>
</body>
</html>
