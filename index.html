<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чайний Каталог</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #4CAF50;
      --danger-color: #ff4d4d;
      --input-bg: #2d2d2d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      padding-bottom: 80px;
    }

    h2, h3 {
      margin-top: 0;
    }

    /* Табы (Навигация) */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Панель Админа */
    .admin-panel {
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #333;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }

    input[type="text"],
    input[type="url"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      background-color: var(--input-bg);
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    /* Карточки Каталога */
    .catalog-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .tea-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .tea-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .tea-price {
      color: var(--accent-color);
      font-weight: bold;
      font-size: 16px;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-edit, .btn-delete {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-edit { background-color: #ff9800; color: white; }
    .btn-delete { background-color: var(--danger-color); color: white; }
  </style>
</head>
<body>

  <!-- Навигация по вкладкам -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tab-catalog')">🍵 Каталог</button>
    <button class="tab-btn" onclick="switchTab('tab-reviews')">💬 Відгуки</button>
  </div>

  <!-- Вкладка 1: Каталог -->
  <div id="tab-catalog" class="tab-content active">
    
    <!-- Панель Администратора (Видна только пользователю с ADMIN_TELEGRAM_ID) -->
    <div id="admin-panel" class="admin-panel" style="display: none;">
      <h2>👑 Панель Адміна</h2>
      <form id="add-tea-form">
        <div class="form-group">
          <label>Назва чаю:</label>
          <input type="text" id="tea-name" required placeholder="Наприклад: Шу Пуер 2018">
        </div>
        <div class="form-group">
          <label>Ціна:</label>
          <input type="text" id="tea-price" required placeholder="Наприклад: 250 грн / 50г">
        </div>
        <div class="form-group">
          <label>Опис:</label>
          <textarea id="tea-desc" required placeholder="Смакові ноти, походження..."></textarea>
        </div>
        <div class="form-group">
          <label>Завантажити фото з пристрою:</label>
          <input type="file" id="tea-image-file" accept="image/*">
        </div>
        <div class="form-group">
          <label>Або посилання на фото (URL):</label>
          <input type="url" id="tea-image-url" placeholder="https://...">
        </div>
        <button type="submit" id="submit-btn" class="btn-submit">Додати чай</button>
      </form>
    </div>

    <!-- Список товаров -->
    <div id="catalog-list" class="catalog-grid"></div>
  </div>

  <!-- Вкладка 2: Отзывы -->
  <div id="tab-reviews" class="tab-content">
    <h2>💬 Відгуки покупців</h2>
    <p>Розділ відгуків у розробці...</p>
  </div>

  <!-- Подключение SDK Firebase (Compat-версия для простой работы через CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // 1. Инициализация Firebase с твоими ключами
    const firebaseConfig = {
      apiKey: "AIzaSyCM1BEHytNhWQ9M7m5VE50ish2_d1X7TTw",
      authDomain: "teacatalog.firebaseapp.com",
      databaseURL: "https://teacatalog-default-rtdb.firebaseio.com",
      projectId: "teacatalog",
      storageBucket: "teacatalog.firebasestorage.app",
      messagingSenderId: "94786669497",
      appId: "1:94786669497:web:e970bd462522ddd41d8468"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Настройки администратора
    const ADMIN_TELEGRAM_ID = 770549804;
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    const currentUserId = tg?.initDataUnsafe?.user?.id || ADMIN_TELEGRAM_ID; 
    const isAdmin = (currentUserId === ADMIN_TELEGRAM_ID);

    let editingItemId = null;

    // 3. Запуск при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
      const adminPanel = document.getElementById('admin-panel');
      if (adminPanel && isAdmin) {
        adminPanel.style.display = 'block';
      }

      const itemForm = document.getElementById('add-tea-form');
      if (itemForm) {
        itemForm.addEventListener('submit', handleFormSubmit);
      }

      loadItemsFromFirebase();
    });

    // Переключение вкладок
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Конвертация файла в Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // Обработка формы (Добавление и Редактирование)
    async function handleFormSubmit(e) {
      e.preventDefault();

      const title = document.getElementById('tea-name').value.trim();
      const price = document.getElementById('tea-price').value.trim();
      const description = document.getElementById('tea-desc').value.trim();
      const fileInput = document.getElementById('tea-image-file');
      const urlInput = document.getElementById('tea-image-url');

      let imageUrl = '';

      if (fileInput && fileInput.files && fileInput.files[0]) {
        imageUrl = await fileToBase64(fileInput.files[0]);
      } else if (urlInput && urlInput.value.trim()) {
        imageUrl = urlInput.value.trim();
      }

      const itemData = {
        title,
        price,
        description,
        updatedAt: Date.now()
      };

      if (imageUrl) {
        itemData.image = imageUrl;
      }

      if (editingItemId) {
        // Режим редактирования
        db.ref('catalog/' + editingItemId).update(itemData)
          .then(() => {
            alert('Позицію оновлено!');
            resetForm();
          })
          .catch(err => alert('Помилка оновлення: ' + err.message));
      } else {
        // Режим добавления
        if (!imageUrl) itemData.image = 'https://via.placeholder.com/300x200?text=No+Image';
        db.ref('catalog').push(itemData)
          .then(() => {
            alert('Позицію додано в каталог!');
            resetForm();
          })
          .catch(err => alert('Помилка збереження: ' + err.message));
      }
    }

    function resetForm() {
      editingItemId = null;
      document.getElementById('add-tea-form').reset();
      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) submitBtn.textContent = 'Додати чай';
    }

    // Загрузка товаров из облачной базы данных в реальном времени
    function loadItemsFromFirebase() {
      const catalogContainer = document.getElementById('catalog-list');

      db.ref('catalog').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!catalogContainer) return;
        catalogContainer.innerHTML = '';

        if (!data) {
          catalogContainer.innerHTML = '<p style="text-align: center; color: #888;">Каталог поки порожній.</p>';
          return;
        }

        Object.keys(data).forEach((id) => {
          const item = data[id];
          const card = document.createElement('div');
          card.className = 'tea-card';
          card.innerHTML = `
            <img src="${item.image}" alt="${item.title}">
            <h3>${item.title}</h3>
            <p class="tea-price">${item.price}</p>
            <p style="color: #ccc; font-size: 14px; line-height: 1.4;">${item.description}</p>
            ${isAdmin ? `
              <div class="admin-actions">
                <button class="btn-edit" onclick="editItem('${id}')">✏️ Редагувати</button>
                <button class="btn-delete" onclick="deleteItem('${id}')">🗑 Видалити</button>
              </div>
            ` : ''}
          `;
          catalogContainer.appendChild(card);
        });
      });
    }

    // Функция для подстановки данных в форму при редактировании
    window.editItem = function(id) {
      db.ref('catalog/' + id).once('value').then((snapshot) => {
        const item = snapshot.val();
        if (!item) return;

        document.getElementById('tea-name').value = item.title || '';
        document.getElementById('tea-price').value = item.price || '';
        document.getElementById('tea-desc').value = item.description || '';

        editingItemId = id;
        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn) submitBtn.textContent = 'Зберегти зміни';

        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    };

    // Функция удаления товара
    window.deleteItem = function(id) {
      if (confirm('Ви дійсно хочете видалити цю позицію?')) {
        db.ref('catalog/' + id).remove();
      }
    };
  </script>
</body>
</html>
